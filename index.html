<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#245c4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="土木2級DB">
  <title>2級土木施工管理士補 学習DB</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">2級土木施工管理士補</p>
      <h1>学習データベース</h1>
    </div>
    <button id="resetFilters" class="ghost-btn" type="button">絞込解除</button>
  </header>

  <main>
    <section class="search-panel" aria-label="検索と絞り込み">
      <label class="search-box" for="searchInput">
        <span aria-hidden="true">🔎</span>
        <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="例：コーン指数、休憩、N値">
        <button id="clearSearch" type="button" class="clear-btn" aria-label="検索文字を消す">×</button>
      </label>

      <div class="filter-group">
        <p class="filter-label">科目</p>
        <div id="subjectFilters" class="chips" role="group" aria-label="科目で絞り込み"></div>
      </div>

      <div class="filter-row">
        <div class="filter-group grow">
          <p class="filter-label">重要度</p>
          <div id="rankFilters" class="chips" role="group" aria-label="重要度で絞り込み"></div>
        </div>
        <label class="select-label">学習状況
          <select id="statusFilter">
            <option value="all">すべて</option>
            <option value="未学習">未学習</option>
            <option value="復習">復習</option>
            <option value="習得">習得</option>
          </select>
        </label>
      </div>
    </section>

    <section class="summary-bar" aria-live="polite">
      <strong id="resultCount">0件</strong>
      <span id="activeSummary">260件から検索</span>
    </section>

    <section id="results" class="results" aria-label="検索結果"></section>
    <button id="moreButton" type="button" class="more-btn" hidden>さらに表示</button>
  </main>

  <template id="cardTemplate">
    <article class="study-card">
      <div class="card-head">
        <div class="badges"></div>
        <button type="button" class="status-button" aria-label="学習状況を変更"></button>
      </div>
      <p class="category"></p>
      <h2 class="title"></h2>
      <p class="summary"></p>
      <div class="key-box">
        <span class="key-label"></span>
        <strong class="key-info"></strong>
      </div>
      <div class="trap-box" hidden>
        <span>⚠ ひっかけ</span>
        <p class="trap"></p>
      </div>
      <details>
        <summary>詳しく見る</summary>
        <div class="details-body"></div>
      </details>
      <div class="learn-actions" role="group" aria-label="学習状況">
        <button type="button" data-status="未学習">未学習</button>
        <button type="button" data-status="復習">復習</button>
        <button type="button" data-status="習得">習得</button>
      </div>
    </article>
  </template>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
